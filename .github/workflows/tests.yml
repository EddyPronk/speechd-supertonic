name: tests
on: [push, pull_request]

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  test:
    name: test (Ubuntu 24.04, speech-dispatcher 0.12.0~rc2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # setup-uv no longer publishes major-version tags, so pin the release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # The dependencies are declared in the server's inline script metadata
          # and in tests/run.sh, not in a requirements file or uv.lock.
          cache-dependency-glob: |
            supertonic_server.py
            tests/run.sh

      # For the speech-dispatcher end-to-end test, which needs speech-dispatcher
      # and a sound server socket. If this step fails, that test reports SKIPPED
      # and the rest still runs.
      - name: Set up speech-dispatcher and a headless sound server
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y speech-dispatcher pulseaudio
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          sudo mkdir -p "$XDG_RUNTIME_DIR"
          sudo chown "$(id -u)" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink

      - name: Run tests
        run: tests/run.sh

  # The setup the project was verified on (speech-dispatcher 0.12). Here the
  # end-to-end test must run: the job fails if it was skipped.
  test-debian:
    name: test (Debian trixie, speech-dispatcher 0.12)
    # Pinned so the container host doesn't change under us (ubuntu-latest moves
    # to Ubuntu 26 from 2026-10-19); the tests run inside the container.
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git procps \
            python3 speech-dispatcher speech-dispatcher-espeak-ng pulseaudio pulseaudio-utils
      - uses: actions/checkout@v7

      # The container runs as root, which PulseAudio refuses, so the tests run as
      # an ordinary user with their own uv and runtime directory.
      - name: Run tests as an unprivileged user
        run: |
          useradd -m -s /bin/bash -u 1001 tester
          chown -R tester "$GITHUB_WORKSPACE"
          install -d -m 700 -o tester /run/user/1001
          runuser -l tester -c '
            set -euo pipefail
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH=$HOME/.local/bin:$PATH XDG_RUNTIME_DIR=/run/user/1001
            pulseaudio --start --exit-idle-time=-1
            pactl load-module module-null-sink
            cd "'"$GITHUB_WORKSPACE"'"
            tests/run.sh | tee "$HOME/test.out"
            if grep -q "speech-dispatcher test: SKIPPED" "$HOME/test.out"; then
                echo "the end-to-end test was skipped"; exit 1
            fi
          '
